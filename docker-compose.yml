version: "3"
services:
  vlibras-translator-text-core:
    # build: .
    image: vlibras/vlibras-translator-text-core:4.2.0
    networks:
      - rabbitmq-net
    environment:
      AMQP_HOST: rabbitmq
      AMQP_PORT: 5672
      AMQP_USER: vlibras
      AMQP_PASS: vlibras
      AMQP_PREFETCH_COUNT: 1
      TRANSLATOR_QUEUE: "translate.to_text"
      WORKER_CAPABILITIES_QUEUE: "worker.capabilities"
      ENABLE_DL_TRANSLATION: "true"
      ENABLE_AGENT_GLOSS_REFINEMENT: "false"
      GLOSS_REFINEMENT_QUEUE: "refine.gloss"
      AGENT_PROVIDER: "openai"
      AGENT_API_URL: "https://api.openai.com/v1"
      AGENT_API_KEY: "changeme"
      AGENT_MODEL: "gpt-4.1-mini"
      HEALTHCHECK_PORT: 80
    depends_on:
      - rabbitmq

  rabbitmq:
    image: rabbitmq:management-alpine
    networks:
      - rabbitmq-net
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - 5673:5672
      - 15673:15672
    environment:
      RABBITMQ_DEFAULT_USER: vlibras
      RABBITMQ_DEFAULT_PASS: vlibras

networks:
  rabbitmq-net:

volumes:
  rabbitmq-data:
